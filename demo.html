<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Application terrain : démo</title>
<style>
:root{--bg:#dfe8ea;--fg:#12232b;--mut:#51666e;--card:#fff;--line:#d3dfe3;--ac:#1d4e6b;--glass:#d8ebf1;--gold:#c98a00;--ok:#1f7a4d;--top:34px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1418;--fg:#e6f0f3;--mut:#9db3ba;--card:#172a31;--line:#27414a;--ac:#7cc4e0;--glass:#1b3640;--gold:#f2b632;--ok:#5fd39a}}
:root[data-theme="dark"]{--bg:#0a1418;--fg:#e6f0f3;--mut:#9db3ba;--card:#172a31;--line:#27414a;--ac:#7cc4e0;--glass:#1b3640;--gold:#f2b632;--ok:#5fd39a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:390px;max-width:100%;height:min(800px,100dvh);border-radius:44px;border:10px solid #0d1a20;background:var(--card);box-shadow:0 20px 50px rgba(10,30,40,.3);overflow:hidden;display:flex;flex-direction:column}
.phone:before{content:"";position:absolute;top:8px;left:50%;width:80px;height:18px;margin-left:-40px;border-radius:10px;background:#0d1a20;z-index:3}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:var(--top) 16px 10px;background:var(--ac);color:var(--bg);font-weight:600}
.bar button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:99px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.scr{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.st small{color:var(--mut)}
.st b{display:block;font-size:18px;margin:2px 0 8px}
.pg{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pg i{display:block;height:100%;background:var(--ok);transition:width .4s}
.task{background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.task h2,.wait h2{margin:0;font-size:20px;line-height:1.25}
.task p,.wait p{margin:0;color:var(--mut);font-size:15px}
.qr{width:84px;height:84px;margin:2px auto;border:3px solid var(--fg);border-radius:6px;background:repeating-conic-gradient(var(--fg) 0 25%,transparent 0 50%) 0 0/16px 16px}
.go{border:0;border-radius:12px;padding:14px;background:var(--gold);color:#1b1300;font-family:inherit;font-weight:600;font-size:16px;cursor:pointer}
.go.alt{background:var(--glass);color:var(--ac)}
.wait{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.sig{border:2px dashed var(--line);border-radius:10px;padding:6px;text-align:center}
.sig svg{width:100%;height:70px}
.bub{padding:10px 12px;border-radius:14px;font-size:15px;max-width:90%}
.bub.q{background:var(--glass);align-self:flex-end}
.bub.a{background:var(--card);border:1px solid var(--line)}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.item time,.item b{display:block;font-size:13px;color:var(--ac);font-weight:600}
.empty{color:var(--mut);text-align:center;margin-top:30px}
.pro{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:14px;padding:14px 16px;font:inherit;cursor:pointer}
.pro b{font-size:17px}
.pro span{color:var(--mut);font-size:14px}
.hi{margin:4px 0 0;font-size:24px;line-height:1.2}
.foot{margin-top:auto;text-align:center;font-size:13px;color:var(--mut)}
.foot a{color:var(--ac)}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:transparent;color:var(--mut);padding:12px 4px;font:inherit;font-size:14px;cursor:pointer;border-top:3px solid transparent}
nav button[aria-selected="true"]{color:var(--ac);font-weight:600;border-top-color:var(--ac)}
.toast{position:absolute;left:14px;right:14px;top:var(--top);background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:14px;z-index:5;transform:translateY(-140%);transition:transform .3s}
.toast.on{transform:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media(max-width:500px){:root{--top:calc(env(safe-area-inset-top,0px) + 12px)}.phone{width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none}.phone:before{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="phone">
<div class="toast" id="toast" role="status"></div>
<div class="bar"><span id="ttl">App terrain</span><button id="sw" onclick="home()" hidden>Profil</button></div>
<div class="scr" id="scr"><noscript>JavaScript est nécessaire pour cette démonstration. Ouvrez la page dans un navigateur.</noscript></div>
<nav id="nav" hidden></nav>
</div>

<script>
const R=[["com","Commercial","Devis et commandes"],["mag","Magasinier","Réception des marchandises"],["ate","Atelier","Fabrication"],["cha","Chauffeur","Tournées et livraisons"],["dir","Direction","Synthèse et questions"]];
const N=Object.fromEntries(R.map(r=>[r[0],r[1]]));
const ST=["Devis D-318 envoyé","En attente de verre","Verre reçu, prêt à lancer","Fabrication : étape 1 sur 3","Prête à livrer","En livraison","Livrée et facturée","Synthèse fournie"];
const SIG='<div class="sig"><svg viewBox="0 0 160 70" aria-label="Signature du client"><path d="M10 45 C30 5 45 75 70 28 S110 60 150 15" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></div>';
const QA='<div class="bub q">Où en sont les commandes de la semaine, et quelle est la marge ?</div><div class="bub a">La commande 2411 est livrée et facturée. Aucune commande en retard. Marge conforme au budget.</div>';
const T=[
{r:"com",h:"08:05",t:"Devis D-318 accepté",x:"Roche Menuiserie a accepté le devis. Créez la commande : l’ordre de fabrication et le QR code sont générés.",b:"Créer la commande 2411",l:"Commande 2411 créée, ordre de fabrication 1187",m:["E-mail","Commande 2411 confirmée. Livraison estimée jeudi."]},
{r:"mag",h:"09:30",t:"Palette à réceptionner",x:"Scannez le QR de la palette : 4 vitrages 44.2 pour la commande 2411.",b:"Scanner et confirmer",qr:1,l:"4 vitrages 44.2 reçus (emplacement B4)"},
{r:"ate",h:"11:10",t:"Ordre 1187 : découpe",x:"Scannez le QR de la pièce, puis validez l’étape. Aucune fiche papier.",b:"Découpe terminée",qr:1,l:"Ordre 1187 : découpe terminée"},
{r:"ate",h:"16:45",t:"Ordre 1187 : finition",x:"Façonnage et assemblage terminés ? Prenez la photo de contrôle.",b:"Déclarer la commande prête",qr:1,l:"Ordre 1187 prêt, client prévenu",m:["SMS","Votre commande 2411 est prête. Livraison jeudi entre 8 h et 10 h."]},
{r:"cha",h:"07:42",t:"Tournée du jeudi",x:"Chargez la commande 2411 et scannez les pièces. Le bon de livraison est généré.",b:"Charger et partir",qr:1,l:"Camion 12 parti, bon de livraison généré",m:["SMS","Le camion est parti à 7 h 42. Arrivée estimée à 9 h 10."]},
{r:"cha",h:"09:14",t:"Livraison chez Roche Menuiserie",x:"Le client vérifie le bon sur l’écran et signe avec le doigt.",b:"Faire signer le client",sub:[SIG,"Envoyer le bon signé"],l:"Bon signé par le client, facture envoyée",m:["E-mail","Bon de livraison signé joint. Facture 2411 jointe : paiement à 30 jours."]},
{r:"dir",h:"10:00",t:"Point de la semaine",x:"Posez votre question à l’agent de synthèse, en langage naturel.",b:"Poser la question",sub:[QA,"Clôturer"],l:"Question posée à l’agent de synthèse"}
];
let role=null,s=0,sub=0,tab="t",log=[],msgs=[],tt;
const $=id=>document.getElementById(id);
function home(){role=null;sub=0;tab="t";draw()}
function pick(r){role=r;sub=0;tab="t";draw()}
function setTab(t){tab=t;draw()}
function reset(){s=0;sub=0;log=[];msgs=[];tab="t";draw()}
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),2600)}
function act(){
 const e=T[s];
 if(e.sub&&!sub){sub=1;draw();return}
 log.push([e.h,e.l]);
 if(e.m){msgs.push([e.h].concat(e.m));toast("Message envoyé au client ("+e.m[0]+")")}
 s++;sub=0;draw();
}
function draw(){
 const scr=$("scr");
 $("sw").hidden=!role;$("nav").hidden=!role;
 if(!role){
  $("ttl").textContent="App terrain";
  scr.innerHTML=`<h1 class="hi">Qui êtes-vous ?</h1><p style="margin:0;color:var(--mut)">Choisissez votre profil pour voir vos tâches.</p>`+
   R.map(r=>`<button class="pro" onclick="pick('${r[0]}')"><b>${r[1]}</b><span>${r[2]}</span></button>`).join("")+
   `<p class="foot">Démonstration, données fictives.<br><a href="index.html">Retour à la présentation</a></p>`;
  return;
 }
 $("ttl").textContent=N[role];
 $("nav").innerHTML=[["t","Tâche"],["j","Journal"],["m","Messages"+(msgs.length?" ("+msgs.length+")":"")]].map(x=>`<button role="tab" aria-selected="${tab===x[0]}" onclick="setTab('${x[0]}')">${x[1]}</button>`).join("");
 if(tab==="j"){scr.innerHTML=log.length?log.slice().reverse().map(x=>`<div class="item"><time>${x[0]}</time>${x[1]}</div>`).join(""):`<p class="empty">Aucune activité pour l’instant.</p>`;return}
 if(tab==="m"){scr.innerHTML=msgs.length?msgs.slice().reverse().map(x=>`<div class="item"><b>${x[0]} · ${x[1]} à Roche Menuiserie</b>${x[2]}</div>`).join(""):`<p class="empty">Aucun message envoyé au client.</p>`;return}
 const st=`<div class="st"><small>Commande 2411 · Roche Menuiserie</small><b>${ST[s]}</b><div class="pg"><i style="width:${s/7*100}%"></i></div></div>`;
 if(s>=T.length){scr.innerHTML=st+`<div class="wait"><h2>Commande terminée</h2><p>Livrée, facturée et archivée, sans aucune ressaisie. Toutes les informations sont dans le journal.</p><button class="go alt" onclick="reset()">Recommencer</button></div>`;return}
 const e=T[s];
 if(e.r===role){
  scr.innerHTML=st+`<div class="task"><h2>${e.t}</h2>${e.qr?'<div class="qr" aria-hidden="true"></div>':''}<p>${e.x}</p>${sub?e.sub[0]:''}<button class="go" onclick="act()">${sub?e.sub[1]:e.b}</button></div>`;
 }else{
  scr.innerHTML=st+`<div class="wait"><h2>Rien à faire pour vous</h2><p>Prochaine action : ${N[e.r]}.</p><button class="go alt" onclick="pick('${e.r}')">Passer au profil ${N[e.r]}</button></div>`;
 }
}
draw();
</script>
</body>
</html>
